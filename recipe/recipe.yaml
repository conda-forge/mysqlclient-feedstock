schema_version: 1

context:
  version: "2.3.2"

package:
  name: mysqlclient
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/mysqlclient/mysqlclient-${{ version }}.tar.gz
  sha256: d8921cc2e8aa0e7f7c1c0b69b17e3a6f370dae235c7e7716938959dac84de4eb

build:
  number: 0
  script:
    - if: unix
      then:
        - python -m pip install . --no-deps --ignore-installed --no-cache-dir -vvv
      # rattler-build >=0.59 no longer falls back to build.bat for an empty script
      else: build.bat

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
    - pkgconf
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib("c") }}
  host:
    - python
    - pip
    - setuptools
    # provides mysql-libs via a run_export
    - mysql-devel
    - if: win
      then: mariadb-connector-c ==3.4.3
  run:
    - python

tests:
  - python:
      imports:
        - MySQLdb
        - MySQLdb.constants
        - MySQLdb.cursors

about:
  license: GPL-2.0-or-later
  license_file: LICENSE
  summary: Python interface to MySQL
  homepage: https://github.com/PyMySQL/mysqlclient-python
  documentation: https://mysqlclient.readthedocs.io/

extra:
  recipe-maintainers:
    - InterferencePattern
    - halldc
    - synapticarbors
